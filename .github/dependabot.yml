version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "java"
    # Collapse routine version churn into a single PR instead of one per artifact.
    groups:
      maven-minor-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Spring Boot major upgrades (e.g. 4.x) are adopted deliberately, not via automated bumps.
      - dependency-name: "org.springframework.boot:*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:15"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    # One grouped PR for routine action updates.
    groups:
      github-actions:
        patterns:
          - "*"
