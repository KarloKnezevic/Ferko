spring:
  application:
    name: ferko-web-api
  datasource:
    url: ${FERKO_DB_URL:jdbc:h2:mem:ferko;MODE=PostgreSQL;DB_CLOSE_DELAY=0;DATABASE_TO_LOWER=TRUE}
    username: ${FERKO_DB_USERNAME:sa}
    password: ${FERKO_DB_PASSWORD:}
    driver-class-name: ${FERKO_DB_DRIVER:org.h2.Driver}
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${FERKO_MAIL_HOST:localhost}
    port: ${FERKO_MAIL_PORT:1025}
    username: ${FERKO_MAIL_USERNAME:}
    password: ${FERKO_MAIL_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    # SMTP reachability must not gate application health/readiness.
    mail:
      enabled: false

ferko:
  mail:
    enabled: ${FERKO_MAIL_ENABLED:false}
    from: ${FERKO_MAIL_FROM:ferko@fer.hr}
  security:
    jwt:
      principal-claim: ${FERKO_JWT_PRINCIPAL_CLAIM:sub}
      roles-claim: ${FERKO_JWT_ROLES_CLAIM:roles}
      issuer-uri: ${FERKO_OIDC_ISSUER_URI:}
      jwk-set-uri: ${FERKO_OIDC_JWK_SET_URI:}
      hmac-secret: ${FERKO_JWT_HMAC_SECRET:}
      allow-hmac-decoder: ${FERKO_JWT_ALLOW_HMAC_DECODER:true}
    dev-token:
      enabled: ${FERKO_DEV_TOKEN_ENABLED:false}
    login-rate-limit:
      enabled: ${FERKO_LOGIN_RATE_LIMIT_ENABLED:false}
      max-attempts: ${FERKO_LOGIN_RATE_LIMIT_MAX_ATTEMPTS:10}
      window-seconds: ${FERKO_LOGIN_RATE_LIMIT_WINDOW_SECONDS:60}
  audit:
    repository: ${FERKO_AUDIT_REPOSITORY:jdbc}
  todo:
    repository: ${FERKO_TODO_REPOSITORY:jdbc}
  seed:
    users:
      enabled: ${FERKO_SEED_USERS_ENABLED:true}
    academic:
      enabled: ${FERKO_SEED_ACADEMIC_ENABLED:true}
      max-courses: ${FERKO_SEED_ACADEMIC_MAX_COURSES:12}
      max-students: ${FERKO_SEED_ACADEMIC_MAX_STUDENTS:120}

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: ${FERKO_DB_URL:jdbc:postgresql://postgres:5432/ferko}
    username: ${FERKO_DB_USERNAME:ferko}
    password: ${FERKO_DB_PASSWORD:ferko}
    driver-class-name: org.postgresql.Driver

management:
  endpoint:
    health:
      probes:
        enabled: true

ferko:
  security:
    dev-token:
      enabled: ${FERKO_DEV_TOKEN_ENABLED:true}

---
spring:
  config:
    activate:
      on-profile: staging | prod
  datasource:
    url: ${FERKO_DB_URL}
    username: ${FERKO_DB_USERNAME}
    password: ${FERKO_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

ferko:
  security:
    jwt:
      issuer-uri: ${FERKO_OIDC_ISSUER_URI:}
      jwk-set-uri: ${FERKO_OIDC_JWK_SET_URI:}
      hmac-secret: ${FERKO_JWT_HMAC_SECRET:}
      allow-hmac-decoder: false
    dev-token:
      enabled: false
    login-rate-limit:
      enabled: ${FERKO_LOGIN_RATE_LIMIT_ENABLED:true}
  seed:
    users:
      enabled: false
    academic:
      enabled: false

management:
  endpoint:
    health:
      show-details: never

server:
  forward-headers-strategy: framework
  shutdown: graceful
  servlet:
    session:
      cookie:
        secure: true
        http-only: true
        same-site: strict
